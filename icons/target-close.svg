<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradV1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="targetRedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowV1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark App Container -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGradV1)" stroke="#313244" stroke-width="4"/>

  <!-- Adwaita Window Outline -->
  <rect x="88" y="120" width="336" height="272" rx="20" fill="#181825" stroke="#45475a" stroke-width="8"/>
  <path d="M 88,176 L 424,176" stroke="#45475a" stroke-width="6"/>

  <!-- Window controls -->
  <circle cx="124" cy="148" r="9" fill="#585b70"/>
  <circle cx="154" cy="148" r="9" fill="#585b70"/>

  <!-- Glowing Target Reticle Locked Top Right (Close Button) -->
  <circle cx="376" cy="148" r="54" fill="url(#targetRedGlow)"/>
  
  <g stroke="#ff3366" fill="none" filter="url(#glowV1)">
    <!-- Outer concentric reticle ring -->
    <circle cx="376" cy="148" r="36" stroke-width="6"/>
    <!-- Inner reticle ring -->
    <circle cx="376" cy="148" r="20" stroke-width="3"/>
    <!-- Crosshair T-ticks -->
    <line x1="376" y1="98" x2="376" y2="198" stroke-width="5"/>
    <line x1="326" y1="148" x2="426" y2="148" stroke-width="5"/>
  </g>

  <!-- Close (X) inside target center -->
  <path d="M 366,138 L 386,158 M 386,138 L 366,158" stroke="#ffffff" stroke-width="6" stroke-linecap="round" filter="url(#glowV1)"/>
  
  <!-- Process Kill Main Symbol inside window body -->
  <path d="M 216,240 L 296,320 M 296,240 L 216,320" stroke="#f38ba8" stroke-width="20" stroke-linecap="round" filter="url(#glowV1)"/>
</svg>
